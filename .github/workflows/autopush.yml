name: Auto push notifications

on:
  # Main trigger: cron-job.org calls the GitHub API every 15 minutes (event "tick"), on time.
  # The bot then decides from the Nairobi clock what is due: new tips/wins every tick,
  # daily reminder 09:00, discount 16:00, cashback 00:00, promo once an hour.
  repository_dispatch:
    types: [tick, hourly, daily, discount, cashback, tips-updated]
  # Backup only: GitHub's own timer is often hours late or skipped.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | poll | daily | test | promo | discount | cashback"
        default: test
        required: true
      only_app:
        description: "Limit to one app id (optional)"
        required: false

permissions:
  contents: write   # lets the job save state.json

concurrency:
  group: autopush
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send notifications
        env:
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'repository_dispatch' && contains(fromJSON('["daily","discount","cashback"]'), github.event.action) && github.event.action) || (github.event.action == 'tips-updated' && 'poll') || 'auto' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_PROMO: ${{ github.event.inputs.mode == 'promo' && '1' || '' }}
          ONLY_APP: ${{ github.event.inputs.only_app }}
        run: node autopush.mjs

      - name: Update team & league logos
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'poll' || github.event.inputs.mode == 'auto')
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node logos.mjs

      - name: Save state
        if: always()
        run: |
          git add -N logos.json 2>/dev/null || true
          if git diff --quiet -- state.json logos.json; then echo "state unchanged"; exit 0; fi
          git config user.name  "autopush-bot"
          git config user.email "autopush-bot@users.noreply.github.com"
          git add state.json logos.json 2>/dev/null || git add state.json
          git commit -m "Update tip state [skip ci]"
          git pull --rebase --autostash || true
          git push