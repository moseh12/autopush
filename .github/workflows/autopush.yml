name: Auto push notifications

on:
  schedule:
    - cron: "0 * * * *"      # check for new / won tips every hour (GitHub may delay a few minutes)
    - cron: "0 6 * * *"      # 06:00 UTC = 09:00 Nairobi — daily "tips are ready" reminder
    - cron: "0 13 * * *"     # 13:00 UTC = 16:00 Nairobi — 30% OFF VIP offer
    - cron: "0 21 * * *"     # 21:00 UTC = 00:00 Nairobi — 50% cashback offer
  repository_dispatch:     # cron-job.org triggers these on time (GitHub's own timer is unreliable)
    types: [hourly, daily, discount, cashback, tips-updated]
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | daily | test | promo | discount | cashback"
        default: test
        required: true
      only_app:
        description: "Limit to one app id (optional)"
        required: false

permissions:
  contents: write   # lets the job save state.json

concurrency:
  group: autopush
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send notifications
        if: github.event.inputs.mode != 'promo'
        env:
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'repository_dispatch' && contains(fromJSON('["daily","discount","cashback"]'), github.event.action) && github.event.action) || (github.event.schedule == '0 6 * * *' && 'daily') || (github.event.schedule == '0 13 * * *' && 'discount') || (github.event.schedule == '0 21 * * *' && 'cashback') || 'poll' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          ONLY_APP: ${{ github.event.inputs.only_app }}
        run: node autopush.mjs

      - name: Hourly VIP promo
        if: always() && (github.event.inputs.mode == 'promo' || (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'repository_dispatch' && github.event.action == 'hourly'))
        env:
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: promo
          ONLY_APP: ${{ github.event.inputs.only_app }}
          FORCE_PROMO: ${{ github.event.inputs.mode == 'promo' && '1' || '' }}
        run: node autopush.mjs

      - name: Update team & league logos
        if: always() && (github.event.inputs.mode == 'poll' || (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'repository_dispatch' && github.event.action == 'hourly'))
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node logos.mjs

      - name: Save state
        if: always()
        run: |
          git add -N logos.json 2>/dev/null || true
          if git diff --quiet -- state.json logos.json; then echo "state unchanged"; exit 0; fi
          git config user.name  "autopush-bot"
          git config user.email "autopush-bot@users.noreply.github.com"
          git add state.json logos.json 2>/dev/null || git add state.json
          git commit -m "Update tip state [skip ci]"
          git pull --rebase --autostash || true
          git push